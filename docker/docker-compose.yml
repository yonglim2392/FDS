version: '3.8'

services:
  # 1. 메인 데이터 저장소 및 배치 분석용 PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: fds-postgres
    environment:
      POSTGRES_USER: fds_user
      POSTGRES_PASSWORD: fds_password
      POSTGRES_DB: fds_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fds-network

  # 2. 실시간 고속 피처 스토어 (Redis)
  redis:
    image: redis:7.0-alpine
    container_name: fds-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - fds-network

  # 3. Kafka 메타데이터 관리자 ZooKeeper
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: fds-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - fds-network

  # 4. 실시간 메시지 큐 Kafka Broker
  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: fds-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # WSL2 호스트와 컨테이너 내부 모두에서 접근 가능하도록 리스너 설정
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - fds-network

networks:
  fds-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
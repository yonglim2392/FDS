version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: fds-postgres
    environment:
      POSTGRES_USER: fds_user
      POSTGRES_PASSWORD: fds_password
      POSTGRES_DB: fds_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fds-network

  redis:
    image: redis:7.0-alpine
    container_name: fds-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - fds-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: fds-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data  # 볼륨 추가
    networks:
      - fds-network

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: fds-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data  # 볼륨 추가
    networks:
      - fds-network

networks:
  fds-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  zookeeper_data:  # 볼륨 정의 추가
  kafka_data:      # 볼륨 정의 추가

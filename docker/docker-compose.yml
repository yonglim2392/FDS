version: '3.8'

services:
  # 1. 데이터 저장을 위한 PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: fds-postgres
    environment:
      POSTGRES_USER: fds_user
      POSTGRES_PASSWORD: fds_password
      POSTGRES_DB: fds_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. Kafka의 메타데이터 관리자 ZooKeeper
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: fds-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  # 3. 실시간 데이터 파이프라인의 중심 Kafka Broker
  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: fds-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

volumes:
  postgres_data: